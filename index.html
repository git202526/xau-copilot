<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#121212" />
<meta name="color-scheme" content="dark" />
<!-- 内联 SVG favicon：避免浏览器自动请求 /favicon.ico 触发 404 console error，零外链 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121212'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' font-family='sans-serif' text-anchor='middle' fill='%23D4A24C'%3EX%3C/text%3E%3C/svg%3E" />
<title>XAU Copilot · 决策指挥中心</title>
<!-- 本工作台通过「GitHub Pages 静态托管 + Actions 数据落盘」搭建，零外部依赖 -->
<style>
:root{
  --bg:#121212; --card:#1E1E1E; --card-2:#242424;
  --line:rgba(255,255,255,.065); --line-2:rgba(255,255,255,.04);
  --tx:#E9ECEF; --tx-2:#9AA3AD; --tx-3:#6B7480;
  --red:#FF5D52; --green:#3FD68C; --amber:#F5A623; --gray:#6B7280;
  --gold:#D4A24C; --violet:#A78BFA;
  --r:14px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx); font-family:var(--sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100vh; padding-bottom:calc(28px + env(safe-area-inset-bottom));
}
.shell{max-width:640px;margin:0 auto;padding:0 12px}

/* ── 顶栏 ── */
.topbar{
  display:flex;align-items:center;gap:10px;padding:14px 4px 10px;
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,#121212 72%,rgba(18,18,18,0));
}
.brand{display:flex;align-items:baseline;gap:7px;min-width:0}
.brand b{font-size:15px;letter-spacing:.4px;font-weight:650}
.brand span{font-size:10px;color:var(--tx-3);letter-spacing:1.2px;text-transform:uppercase}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(63,214,140,.75)}
.dot.warn{background:var(--amber);box-shadow:0 0 8px rgba(245,166,35,.7)}
.dot.bad{background:var(--red);box-shadow:0 0 8px rgba(255,93,82,.7)}
.iconbtn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--tx-2);display:grid;place-items:center;cursor:pointer;
  transition:background .16s,color .16s;
}
.iconbtn:active{background:var(--card-2);color:var(--tx)}
.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ── 晨报气泡 ── */
.bubble{
  position:relative;border-radius:16px;padding:15px 16px 13px;margin-bottom:12px;
  background:linear-gradient(150deg,#232323 0%,#1A1A1A 58%,#191919 100%);
  border:1px solid rgba(212,162,76,.16);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 26px rgba(0,0,0,.34);
  overflow:hidden;
}
.bubble::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,var(--gold),rgba(212,162,76,.06));
}
.bubble::after{
  content:"";position:absolute;right:-40px;top:-58px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,162,76,.13),transparent 68%);pointer-events:none;
}
.b-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tag{
  font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--gold);
  border:1px solid rgba(212,162,76,.34);border-radius:5px;padding:1.5px 6px;font-weight:600;
}
.b-head time{font-size:10.5px;color:var(--tx-3);font-family:var(--mono)}
.b-text{margin:0;font-size:15px;line-height:1.62;font-weight:450;letter-spacing:.15px}
.b-text em{font-style:normal;color:var(--amber);font-weight:600}
.b-text u{text-decoration:none;color:var(--red);font-weight:600}
.b-text i{font-style:normal;color:var(--green);font-weight:600}
.b-foot{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{
  font-size:10px;padding:2.5px 7px;border-radius:5px;background:rgba(255,255,255,.045);
  color:var(--tx-2);border:1px solid var(--line-2);font-family:var(--mono);
}
.chip.warn{color:var(--amber);border-color:rgba(245,166,35,.28);background:rgba(245,166,35,.08)}
.chip.bad{color:var(--red);border-color:rgba(255,93,82,.28);background:rgba(255,93,82,.08)}
.chip.ok{color:var(--green);border-color:rgba(63,214,140,.26);background:rgba(63,214,140,.08)}

/* ── 卡片 ── */
.card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 15px 13px 17px;margin-bottom:10px;
  overflow:hidden;transition:border-color .2s;
}
.card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bar,var(--gray));
  opacity:.92;
}
.card[data-tone="red"]{--bar:var(--red)}
.card[data-tone="green"]{--bar:var(--green)}
.card[data-tone="amber"]{--bar:var(--amber)}
.card[data-tone="gray"]{--bar:var(--gray)}
.card[data-tone="violet"]{--bar:var(--violet)}
.card.fuse{border-color:rgba(255,93,82,.22);background:linear-gradient(180deg,rgba(255,93,82,.06),var(--card) 62%)}

.c-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.c-no{font-family:var(--mono);font-size:10px;color:var(--tx-3);letter-spacing:.6px}
.c-title{font-size:12px;font-weight:600;color:var(--tx-2);letter-spacing:.3px}
.c-head .badge{margin-left:auto}

/* 徽章 */
.badge{
  font-size:10.5px;font-weight:700;padding:2.5px 9px;border-radius:6px;letter-spacing:.6px;
  font-family:var(--mono);
}
.b-high{background:rgba(255,93,82,.16);color:#FF8A80;border:1px solid rgba(255,93,82,.34)}
.b-mid{background:rgba(63,214,140,.14);color:#6FE3AC;border:1px solid rgba(63,214,140,.3)}
.b-low{background:rgba(245,166,35,.15);color:#FFC05C;border:1px solid rgba(245,166,35,.34)}
.b-deg{background:rgba(255,255,255,.06);color:var(--tx-3);border:1px solid var(--line)}

/* ── M1 宏观雷达 ── */
.pills{display:flex;gap:6px;margin-bottom:12px}
.pill{
  flex:1;min-width:0;background:var(--card-2);border:1px solid var(--line-2);border-radius:9px;
  padding:7px 8px;text-align:center;
}
.pill .k{font-size:9px;color:var(--tx-3);letter-spacing:.8px;font-family:var(--mono);display:block}
.pill .v{font-size:13.5px;font-weight:650;font-family:var(--mono);margin-top:1px;display:block;letter-spacing:-.2px}
.pill .v.up{color:var(--red)}    /* 国内习惯：涨红 */
.pill .v.dn{color:var(--green)}
.pill .v.flat{color:var(--tx-2)}

.dual{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden}
.dual>div{background:var(--card);padding:10px 11px}
.dual .lbl{font-size:9.5px;color:var(--tx-3);letter-spacing:.9px;margin-bottom:3px;font-family:var(--mono)}
.dual .big{font-size:19px;font-weight:650;font-family:var(--mono);letter-spacing:-.6px;line-height:1.2}
.dual .unit{font-size:10px;color:var(--tx-3);font-weight:400;margin-left:2px;letter-spacing:0}
.dual .sub{font-size:10.5px;color:var(--tx-2);margin-top:3px;display:flex;align-items:center;gap:4px}
.sig{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;letter-spacing:.3px}
.sig.buy{color:#6FE3AC;background:rgba(63,214,140,.13)}
.sig.sell{color:#FF8A80;background:rgba(255,93,82,.13)}
.sig.mid{color:var(--tx-2);background:rgba(255,255,255,.06)}

.prem{
  margin-top:10px;padding-top:9px;border-top:1px solid var(--line-2);
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--tx-2);
}
.prem b{font-family:var(--mono);font-size:13px;font-weight:650}
.prem.frozen{color:var(--tx-3)}
.prem .lock{font-size:9.5px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--tx-3)}

/* ── M2 决策 ── */
.verdict{text-align:center;padding:6px 0 12px}
.verdict .hl{font-size:25px;font-weight:750;letter-spacing:-.5px;line-height:1.2}
.verdict .hl.red{color:var(--red)}
.verdict .hl.green{color:var(--green)}
.verdict .hl.amber{color:var(--amber)}
.verdict .hl.gray{color:var(--tx-2)}
.verdict .hl.violet{color:var(--violet)}
.vs{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--card-2);border-radius:10px;padding:10px 8px;margin-bottom:10px;
}
.vs .side{flex:1;text-align:center;min-width:0}
.vs .side .k{font-size:9px;color:var(--tx-3);letter-spacing:.8px;margin-bottom:2px}
.vs .side .v{font-size:13px;font-weight:650;font-family:var(--mono)}
.vs .side .v.dn{color:var(--green)}   /* 空头用绿（跌） */
.vs .side .v.up{color:var(--red)}
.vs .mid{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap}
.vs .mid.bad{color:var(--amber);background:rgba(245,166,35,.14);border:1px solid rgba(245,166,35,.3)}
.vs .mid.ok{color:var(--green);background:rgba(63,214,140,.12);border:1px solid rgba(63,214,140,.28)}
.note{font-size:12px;line-height:1.6;color:var(--tx-2);margin:0}

/* ── M2 外部技术指标网格 ── */
.tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.tech-grid .tc{background:var(--card-2);padding:7px 10px;min-width:0}
.tech-grid .tc .k{font-size:9px;color:var(--tx-3);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tech-grid .tc .v{font-size:12.5px;font-weight:700;font-family:var(--mono);letter-spacing:-.2px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tech-grid .tc .v.up{color:var(--red)}    /* 国内习惯：偏多/涨 红 */
.tech-grid .tc .v.dn{color:var(--green)}  /* 偏空/跌 绿 */
.tech-grid .tc .v.flat{color:var(--tx-2)}
.tech-grid .tc .n{font-size:9px;color:var(--tx-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:640px){.tech-grid{grid-template-columns:repeat(3,1fr)}}

/* ── M3 体检 ── */
.pnl-wrap{text-align:center;padding:4px 0 10px}
.pnl-cap{font-size:10.5px;color:var(--tx-3);letter-spacing:1px;margin-bottom:3px}
.pnl{font-size:32px;font-weight:750;font-family:var(--mono);letter-spacing:-1.4px;line-height:1.1}
.pnl.red{color:var(--red)}
.pnl.green{color:var(--green)}
.pnl.gray{color:var(--tx-2);font-size:22px;letter-spacing:-.5px}
.pnl-sub{font-size:11px;color:var(--tx-2);margin-top:5px;font-family:var(--mono)}
.pnl-sub b{color:var(--tx);font-weight:600}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:2px}
.grid2>div{background:var(--card-2);padding:10px 11px}
.grid2 .k{font-size:9.5px;color:var(--tx-3);letter-spacing:.7px;margin-bottom:2px}
.grid2 .v{font-size:16px;font-weight:700;font-family:var(--mono);letter-spacing:-.4px}

.alert-strip{
  margin-top:10px;display:flex;align-items:center;gap:7px;
  border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.45;
}
.alert-strip.red{background:rgba(255,93,82,.1);border:1px solid rgba(255,93,82,.26);color:#FF9E96}
.alert-strip.green{background:rgba(63,214,140,.08);border:1px solid rgba(63,214,140,.22);color:#7FE6B4}
.alert-strip.gray{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--tx-3)}
.alert-strip.amber{background:rgba(245,166,35,.10);border:1px solid rgba(245,166,35,.30);color:#FFC862}
.alert-strip svg{width:13px;height:13px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ── 行数据 ── */
.rows{margin-top:2px}
.row{
  display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-2);
  font-size:12px;
}
.row:last-child{border-bottom:0}
.row .k{color:var(--tx-2);flex:0 0 auto}
.row .v{margin-left:auto;font-family:var(--mono);font-weight:600;text-align:right}
.row .v.red{color:var(--red)} .row .v.green{color:var(--green)} .row .v.amber{color:var(--amber)}
.mini{font-size:9.5px;color:var(--tx-3);margin-left:5px;font-weight:400}

/* 档位条 */
.levels{display:flex;gap:3px;margin-top:9px;align-items:flex-end;height:30px}
.levels i{
  flex:1;border-radius:2px 2px 0 0;background:rgba(255,255,255,.07);
  position:relative;transition:background .2s;
}
.levels i.on{background:rgba(63,214,140,.34)}
.levels i.next{background:rgba(245,166,35,.6);box-shadow:0 0 0 1px rgba(245,166,35,.35)}
.levels i.now{background:rgba(255,93,82,.55)}

/* 账户条 */
.acct{padding:9px 0;border-bottom:1px solid var(--line-2)}
.acct:last-child{border-bottom:0}
.acct .top{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:5px}
.acct .nm{font-weight:600}
.acct .tag2{font-size:9px;padding:1px 5px;border-radius:4px;letter-spacing:.4px}
.tag2.cut{color:#FF9E96;background:rgba(255,93,82,.13)}
.tag2.add{color:#7FE6B4;background:rgba(63,214,140,.12)}
.acct .cost{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--tx-2)}
.acct .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.acct .bar i{display:block;height:100%;border-radius:2px;background:var(--gold);opacity:.72}

/* 纪律条目 */
.disc{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:11.5px;line-height:1.5;color:var(--tx-2)}
.disc:not(:last-child){border-bottom:1px solid var(--line-2)}
.disc .b{width:5px;height:5px;border-radius:50%;margin-top:6px;flex:0 0 auto;background:var(--gray)}
.disc.bad .b{background:var(--red)}
.disc.ok .b{background:var(--green)}

/* 降级条 */
.deg{
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--tx-3);
  background:rgba(255,255,255,.03);border:1px dashed var(--line);border-radius:8px;padding:9px 10px;margin-top:8px;
}

/* ── 弹窗 ── */
.modal{
  position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
}
.modal[hidden]{display:none}
.modal .box{
  width:100%;max-width:340px;background:#1F1F1F;border:1px solid rgba(255,93,82,.34);
  border-radius:16px;padding:20px 18px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.modal .warn-ico{width:40px;height:40px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:rgba(255,93,82,.12)}
.modal .warn-ico svg{width:20px;height:20px;fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modal h3{margin:0 0 8px;font-size:16px;color:#FF9E96}
.modal p{margin:0 0 14px;font-size:12.5px;color:var(--tx-2);line-height:1.6}
.modal .cd{font-family:var(--mono);font-size:26px;font-weight:750;color:var(--red);margin-bottom:4px}
.modal .cd small{font-size:10px;color:var(--tx-3);font-weight:400;display:block;letter-spacing:1px}
.modal .btns{display:flex;gap:8px}
.modal button{
  flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card-2);
  color:var(--tx);font-size:13px;font-weight:600;font-family:var(--sans);cursor:pointer;
}
.modal button.danger{background:rgba(255,93,82,.14);border-color:rgba(255,93,82,.36);color:#FF9E96}

/* ── 设置抽屉 ── */
.drawer{
  position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
}
.drawer[hidden]{display:none}
.drawer .panel{
  position:absolute;right:0;bottom:0;left:0;max-width:640px;margin:0 auto;
  background:#191919;border-top-left-radius:18px;border-top-right-radius:18px;
  border-top:1px solid var(--line);padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:82vh;overflow:auto;
}
.drawer h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center}
.drawer h3 button{margin-left:auto;background:none;border:0;color:var(--tx-3);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;color:var(--tx-3);margin-bottom:5px;letter-spacing:.5px}
.fld input{
  width:100%;height:42px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--tx);padding:0 11px;font-size:16px;font-family:var(--mono);
}
.fld .hint{font-size:10.5px;color:var(--tx-3);margin-top:4px;line-height:1.5}
.btn-row{display:flex;gap:8px;margin-top:4px}
.btn-row button{
  flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--tx);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans);
}
.btn-row button.primary{background:rgba(212,162,76,.16);border-color:rgba(212,162,76,.4);color:#E8C98A}

/* ── 页脚 ── */
.foot{
  margin-top:14px;padding:12px 4px 0;border-top:1px solid var(--line-2);
  font-size:10px;color:var(--tx-3);line-height:1.7;
}
.foot b{color:var(--tx-2);font-weight:600}
.foot .src{font-family:var(--mono);font-size:9.5px}

/* 骨架屏 */
.skel{background:linear-gradient(90deg,#1E1E1E 25%,#262626 50%,#1E1E1E 75%);background-size:200% 100%;
  animation:sk 1.3s ease-in-out infinite;border-radius:6px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.rise{animation:rise .42s cubic-bezier(.22,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .rise,.skel{animation:none}
}
/* 桌面 */
@media (min-width:640px){
  .shell{padding:0 18px}
  .dual .big{font-size:21px}
  .pnl{font-size:36px}
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><b>XAU Copilot</b><span>Decision Deck</span></div>
    <div class="tb-right">
      <span class="dot" id="live-dot" title="数据源状态"></span>
      <button class="iconbtn" id="btn-refresh" title="刷新" aria-label="刷新">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="iconbtn" id="btn-settings" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main id="app">
    <section id="m0" aria-label="AI 晨报"></section>
    <section id="m1" aria-label="宏观与双轨雷达"></section>
    <section id="m2" aria-label="外部技术面决策"></section>
    <section id="m3" aria-label="账户体检"></section>
    <section id="m4" aria-label="网格效率"></section>
    <section id="m5" aria-label="多账户再平衡"></section>
    <section id="m6" aria-label="纪律复盘"></section>
  </main>

  <footer class="foot">
    <div><b>XAU Copilot</b> · 外部行情指标决策辅助，不构成投资建议。</div>
    <div class="src" id="foot-src">数据源：XAUUSD 外部实时行情 · 服务端预算指标 · 宏观</div>
  </footer>
</div>

<div class="modal" id="fomo" hidden>
  <div class="box">
    <div class="warn-ico">
      <svg viewBox="0 0 24 24"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
    </div>
    <h3>纪律扣分 · 逆势接飞刀</h3>
    <p id="fomo-text">外部技术面偏空，今日仍有买入操作。是否确认强行买入？</p>
    <div class="cd" id="fomo-cd">10<small>秒后可确认</small></div>
    <div class="btns">
      <button id="fomo-cancel">取消（推荐）</button>
      <button id="fomo-ok" class="danger" disabled>强行买入</button>
    </div>
  </div>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="panel">
    <h3>设置<button id="drawer-close" aria-label="关闭">×</button></h3>
    <div class="fld">
      <label>Webhook 推送地址（可选）</label>
      <input id="set-hook" type="url" inputmode="url" placeholder="https://..." />
      <div class="hint">外部技术面转空/转多或熔断时静默 POST 一次，同日去重。留空则关闭推送。</div>
    </div>
    <div class="fld">
      <label>强制刷新间隔</label>
      <div class="hint">现价 60 秒、宏观与评级 15 分钟自动刷新；点右上角可立即重取。</div>
    </div>
    <div class="btn-row">
      <button id="btn-export">导出 JSON</button>
      <button id="btn-clear" class="primary">清除本地缓存</button>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
