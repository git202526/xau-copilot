<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<title>XAU Copilot · 多源印证决策台</title>
<meta name="description" content="XAU Copilot：内部结构 × 外部 MA20 双源交叉印证，输出决策、压测、网格效率与纪律复盘（无 K 线主图）。" />
<style>
  :root{
    --bg:#070a0e; --bg2:#0b1016; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.028);
    --line:rgba(255,255,255,.09); --tx:#e8edf4; --tx2:#9aa7b6; --tx3:#65717f;
    --red:#ef4444; --green:#22c55e; --amber:#f59e0b; --gray:#64748b; --gold:#d4a24c;
    --r:16px; --sh:0 1px 0 rgba(255,255,255,.05) inset, 0 12px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 480px at 82% -8%, rgba(212,162,76,.10), transparent 62%),
      radial-gradient(700px 420px at 6% 8%, rgba(59,130,246,.10), transparent 60%),
      var(--bg);
    color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:15px; line-height:1.55; min-height:100vh;
    padding:0 14px calc(28px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto}
  /* header */
  header.top{display:flex;align-items:center;gap:10px;padding:16px 2px 10px;position:sticky;top:0;z-index:9;
    background:linear-gradient(180deg,rgba(7,10,14,.96),rgba(7,10,14,.72) 70%,transparent);backdrop-filter:blur(8px)}
  .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(145deg,#1b232e,#0d1218);border:1px solid rgba(212,162,76,.35);box-shadow:var(--sh)}
  .logo svg{width:19px;height:19px}
  .brand h1{margin:0;font-size:16px;letter-spacing:.4px;font-weight:650}
  .brand p{margin:1px 0 0;font-size:10.5px;color:var(--tx3);letter-spacing:.6px;text-transform:uppercase}
  .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
  button{font:inherit;color:inherit;cursor:pointer;border-radius:11px;border:1px solid var(--line);
    background:rgba(255,255,255,.05);min-height:44px;min-width:44px;padding:0 13px;display:inline-flex;align-items:center;gap:7px}
  button:active{transform:scale(.97)}
  button svg{width:16px;height:16px}
  .ghost{background:transparent;color:var(--tx2)}
  /* status strip */
  .status{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--tx3);padding:0 2px 12px}
  .status b{color:var(--tx2);font-weight:600}
  .status .warn{color:var(--amber)}
  /* M0 bubble */
  .bubble{position:relative;border-radius:18px;padding:16px 16px 13px;margin:2px 0 14px;
    background:linear-gradient(160deg,#151c26 0%,#0d131b 58%,#0a0f15 100%);
    border:1px solid rgba(255,255,255,.10);box-shadow:0 18px 44px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.07) inset;
    overflow:hidden}
  .bubble:before{content:"";position:absolute;inset:0 0 auto;height:3px;
    background:linear-gradient(90deg,var(--green),var(--gold),var(--red));opacity:.85}
  .bubble-top{display:flex;align-items:center;gap:7px;margin-bottom:8px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(212,162,76,.14);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .bubble-label{font-size:11px;letter-spacing:1.4px;color:var(--gold);text-transform:uppercase;font-weight:600}
  .bubble-time{margin-left:auto;font-size:10.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
  .bubble-text{margin:0;font-size:16.5px;line-height:1.72;letter-spacing:.2px;color:#eef3f9;font-weight:450}
  .bubble-foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{font-size:10.5px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--tx2);border:1px solid var(--line)}
  .chip--ok{color:#86efac;border-color:rgba(34,197,94,.32);background:rgba(34,197,94,.10)}
  .chip--warn{color:#fcd34d;border-color:rgba(245,158,11,.32);background:rgba(245,158,11,.10)}
  /* cards */
  .card{position:relative;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
    border-radius:var(--r);padding:14px 14px 12px 17px;margin-bottom:11px;box-shadow:var(--sh);
    backdrop-filter:blur(14px) saturate(1.05)}
  .card .bar{position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--gray)}
  .tone--red .bar{background:var(--red);box-shadow:0 0 12px rgba(239,68,68,.55)}
  .tone--green .bar{background:var(--green);box-shadow:0 0 12px rgba(34,197,94,.5)}
  .tone--amber .bar{background:var(--amber);box-shadow:0 0 12px rgba(245,158,11,.5)}
  .tone--gray .bar{background:var(--gray)}
  .tone--red{border-color:rgba(239,68,68,.30)}
  .tone--green{border-color:rgba(34,197,94,.28)}
  .tone--amber{border-color:rgba(245,158,11,.28)}
  .card-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px}
  .card-title{display:flex;align-items:center;gap:7px;min-width:0}
  .card-title h2{margin:0;font-size:13.5px;font-weight:620;letter-spacing:.2px;white-space:nowrap}
  .no{font-size:10px;color:var(--tx3);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:5px;padding:0 4px;line-height:15px}
  .card-tag{margin-left:auto;font-size:10px;color:var(--tx3);white-space:nowrap;padding-top:2px}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.3px;white-space:nowrap}
  .badge--high{background:rgba(34,197,94,.16);color:#86efac;border:1px solid rgba(34,197,94,.45)}
  .badge--low{background:rgba(245,158,11,.18);color:#fcd34d;border:1px solid rgba(245,158,11,.5)}
  .badge--degraded{background:rgba(100,116,139,.2);color:#cbd5e1;border:1px solid rgba(148,163,184,.4)}
  .verdict{margin:0;font-size:14.5px;line-height:1.68;color:#dde5ee}
  .txt-red{color:#fca5a5}
  .degraded-strip{margin-top:9px;font-size:11.5px;color:#fcd34d;background:rgba(245,158,11,.08);border:1px dashed rgba(245,158,11,.35);
    border-radius:9px;padding:7px 9px}
  /* gauge */
  .gauge{width:100%;height:auto;margin:10px 0 2px;display:block}
  .gauge .g-l,.gauge .g-r{font-size:9.5px;fill:#7c8896;font-family:inherit}
  /* kv */
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
  .kv-i{background:rgba(255,255,255,.032);border:1px solid rgba(255,255,255,.055);border-radius:10px;padding:7px 9px;min-width:0}
  .kv-i span{display:block;font-size:10px;color:var(--tx3);letter-spacing:.3px}
  .kv-i b{font-size:13px;font-weight:620;font-variant-numeric:tabular-nums;display:block;margin-top:1px}
  .kv-i em{font-style:normal;font-size:9.5px;color:var(--tx3);font-weight:400}
  .loss{color:#fca5a5}
  /* stress bar */
  .stress-bar{position:relative;height:22px;border-radius:7px;background:rgba(255,255,255,.05);margin-top:10px;overflow:hidden}
  .stress-bar span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(239,68,68,.55),rgba(239,68,68,.18))}
  .stress-bar i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:10.5px;color:#e6edf5;font-variant-numeric:tabular-nums}
  /* duo */
  .duo{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
  .duo-i{background:rgba(255,255,255,.032);border:1px solid rgba(255,255,255,.055);border-radius:10px;padding:7px 8px;text-align:center}
  .duo-i span{display:block;font-size:9.5px;color:var(--tx3)}
  .duo-i b{font-size:14px;font-variant-numeric:tabular-nums}
  .duo-i em{font-style:normal;font-size:9px;color:var(--tx3)}
  /* accounts */
  .acct{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .acct-i{flex:1 1 40%;background:rgba(255,255,255,.032);border:1px solid rgba(255,255,255,.055);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;min-width:0}
  .acct-i span{font-size:10.5px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acct-i b{font-size:14px;font-variant-numeric:tabular-nums;margin-top:1px}
  .acct-i em{font-style:normal;font-size:10px;color:var(--tx3)}
  .acct-i.hi{border-color:rgba(239,68,68,.35)}
  .acct-i.lo{border-color:rgba(34,197,94,.32)}
  /* ops */
  .ops{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
  .ops li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums}
  .ops em{font-style:normal;margin-left:auto;font-size:10.5px;color:var(--tx3)}
  .op{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700}
  .op.buy{background:rgba(239,68,68,.16);color:#fca5a5}
  .op.sell{background:rgba(34,197,94,.16);color:#86efac}
  /* settings */
  details.set{margin:6px 0 4px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025);padding:0 12px}
  details.set summary{list-style:none;cursor:pointer;padding:11px 0;font-size:12.5px;color:var(--tx2);display:flex;align-items:center;gap:6px}
  details.set summary::-webkit-details-marker{display:none}
  details.set[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
  .set-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .set-row input{flex:1 1 180px;min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:9px;
    color:var(--tx);padding:11px 11px;font-size:16px;font-family:inherit}
  .set-row input::placeholder{color:#4d5866}
  .set-note{font-size:10.5px;color:var(--tx3);margin:0 0 12px;line-height:1.6}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:#151c26;border:1px solid var(--line);color:var(--tx);font-size:12.5px;padding:9px 15px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.6)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  footer{margin-top:14px;font-size:10.5px;color:#4a5563;line-height:1.7;text-align:center}
  footer a{color:#7c8896;text-decoration:none;border-bottom:1px dotted #3a4451}
  .is-loading .card,.is-loading .bubble{opacity:.6}
  @media (max-width:359px){
    body{font-size:14px;padding-left:11px;padding-right:11px}
    .bubble-text{font-size:15.5px}
    .kv{grid-template-columns:1fr}
  }
  @media (min-width:640px){
    .kv{grid-template-columns:repeat(4,1fr)}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#d4a24c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l7 4v5c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V7z"/><path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <div class="brand">
      <h1>XAU Copilot</h1>
      <p>multi-source · no k-line</p>
    </div>
    <div class="top-actions">
      <button id="btn-refresh" class="ghost" aria-label="刷新数据">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v4h-4"/></svg>
        <span style="font-size:12.5px">刷新</span>
      </button>
    </div>
  </header>

  <div class="status" id="status">正在读取 GitHub 快照与外部行情…</div>

  <div id="briefing"></div>
  <div id="decision"></div>
  <div id="trade-plan"></div>
  <div id="stress"></div>
  <div id="grid"></div>
  <div id="rebalance"></div>
  <div id="discipline"></div>

  <details class="set">
    <summary>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 13.6H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 17 4.7l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      推送与数据设置
    </summary>
    <div class="set-row">
      <input id="hook-url" type="url" inputmode="url" placeholder="Webhook URL（飞书/钉钉/Slack，可留空）" autocomplete="off" />
      <button id="btn-hook">保存</button>
    </div>
    <p class="set-note">仅在「强共振」或「网格熔断」时静默推送一次（同事件同日去重）。URL 只存本机浏览器，不进仓库、不参与业务数据。业务数据（持仓/计划/操作）全部来自 GitHub，换设备打开同一地址即一致。</p>
    <div class="set-row">
      <button id="btn-export" class="ghost">导出快照 JSON</button>
      <button id="btn-reload" class="ghost">强制重取</button>
    </div>
  </details>

  <footer>
    数据源：<span id="src-note">git202526/xau-desk-data</span> · 外部校验：Binance PAXG / Yahoo GC=F<br />
    本页只做多源印证与纪律复核，不含 K 线主图，不构成投资建议。
  </footer>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
