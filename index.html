<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#06080b" />
<title>XAU Copilot · 多源印证决策台</title>
<meta name="description" content="XAU Copilot：内部结构 × XAUUSD MA20 双源交叉印证，输出决策、压测、网格效率与纪律复盘（无 K 线主图）。" />
<style>
  :root{
    --bg:#06080b; --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.05);
    --tx:#eef3f9; --tx2:#a3b0c0; --tx3:#65727f; --gold:#d9a84e;
    --rise:#ff5d52; --fall:#1ec27b; --warn:#f2b03d; --neutral:#6f7f92;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.6;
    background:
      radial-gradient(760px 420px at 88% -12%, rgba(217,168,78,.11), transparent 60%),
      radial-gradient(620px 380px at -6% 4%, rgba(74,122,255,.09), transparent 62%),
      var(--bg);
    min-height:100vh;
    padding:0 16px calc(30px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:600px;margin:0 auto}

  /* ── 顶栏 ───────────────────────────── */
  .top{display:flex;align-items:center;gap:9px;padding:18px 0 12px;position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,rgba(6,8,11,.97) 55%,rgba(6,8,11,0));backdrop-filter:blur(10px)}
  .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
    background:linear-gradient(150deg,#232c38,#0b1017);border:1px solid rgba(217,168,78,.34);
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 8px 20px rgba(0,0,0,.5)}
  .mark svg{width:16px;height:16px}
  .brand{display:flex;flex-direction:column;gap:1px;min-width:0}
  .brand h1{margin:0;font-size:14px;font-weight:640;letter-spacing:.16em;text-transform:uppercase}
  .brand p{margin:0;font-size:9.5px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--tx2);
    border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:rgba(255,255,255,.03);white-space:nowrap}
  .live i{width:5px;height:5px;border-radius:50%;background:var(--fall);box-shadow:0 0 0 3px rgba(30,194,123,.15);animation:breath 2.6s infinite}
  .live[data-degraded="true"] i{background:var(--warn);box-shadow:0 0 0 3px rgba(242,176,61,.16)}
  @keyframes breath{0%,100%{opacity:1}50%{opacity:.35}}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
  .icon-btn{width:44px;height:44px;margin:-8px -10px -8px 0;display:grid;place-items:center;border-radius:12px;color:var(--tx2)}
  .icon-btn:active{background:rgba(255,255,255,.06)}
  .icon-btn svg{width:17px;height:17px}

  /* ── 报价条 ─────────────────────────── */
  .quote{display:flex;align-items:flex-end;gap:14px;padding:2px 2px 12px}
  .q-main{min-width:0;flex:1}
  .q-sym{font-size:10.5px;letter-spacing:.16em;color:var(--tx3);text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .q-sym b{color:var(--tx2);font-weight:600;letter-spacing:.1em}
  .q-price{font-family:var(--mono);font-size:clamp(30px,9vw,38px);line-height:1.06;font-weight:500;
    letter-spacing:-.02em;margin:3px 0 3px;font-variant-numeric:tabular-nums}
  .q-sub{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tx3);flex-wrap:wrap}
  .q-dev{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px}
  .q-dev.up{color:var(--rise);background:rgba(255,93,82,.11)}
  .q-dev.down{color:var(--fall);background:rgba(30,194,123,.11)}
  .q-dev.flat{color:var(--tx2);background:rgba(255,255,255,.06)}
  .spark{width:132px;height:56px;flex:0 0 auto;opacity:.95;margin-bottom:2px}
  .spark .ln{fill:none;stroke:rgba(217,168,78,.85);stroke-width:1.4}
  .spark .ma{fill:none;stroke:rgba(255,255,255,.26);stroke-width:1;stroke-dasharray:2 2.5}

  /* ── 状态条 ─────────────────────────── */
  .status{display:flex;flex-wrap:wrap;gap:3px 9px;font-size:9.5px;color:var(--tx3);
    padding:0 2px 12px;letter-spacing:.02em}
  .status b{color:var(--tx2);font-weight:600;font-variant-numeric:tabular-nums}
  .status .warn{color:var(--warn)}

  /* ── 晨报气泡 ───────────────────────── */
  .bubble{position:relative;border:1px solid rgba(255,255,255,.09);border-radius:18px;overflow:hidden;
    padding:15px 16px 12px 17px;margin:0 0 12px;
    background:linear-gradient(158deg,#161d27 0%,#0e141c 55%,#0a0e14 100%);
    box-shadow:0 20px 44px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.06) inset}
  .bubble:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
    background:linear-gradient(180deg,var(--gold),rgba(217,168,78,0))}
  .b-head{display:flex;align-items:center;gap:7px;margin-bottom:9px}
  .b-head .tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:650}
  .b-head .sep{width:14px;height:1px;background:rgba(217,168,78,.5)}
  .b-head time{margin-left:auto;font-size:10px;color:var(--tx3);font-variant-numeric:tabular-nums;font-family:var(--mono)}
  .b-text{margin:0;font-size:16px;line-height:1.74;color:#e9eef6;letter-spacing:.01em}
  .b-foot{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}
  .chip{font-size:10px;padding:2.5px 7px;border-radius:999px;color:var(--tx2);border:1px solid var(--line);
    background:rgba(255,255,255,.03);white-space:nowrap}
  .chip.ok{color:#8ce8bb;border-color:rgba(30,194,123,.3);background:rgba(30,194,123,.09)}
  .chip.warn{color:#f7cd83;border-color:rgba(242,176,61,.3);background:rgba(242,176,61,.09)}

  /* ── 卡片 ───────────────────────────── */
  .card{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    padding:15px 16px 13px 19px;margin-bottom:12px;
    background:linear-gradient(180deg,rgba(255,255,255,.047),rgba(255,255,255,.017));
    box-shadow:0 1px 0 rgba(255,255,255,.045) inset,0 14px 34px rgba(0,0,0,.34);
    backdrop-filter:blur(12px) saturate(1.06)}
  .card:before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:2px;border-radius:2px;
    background:var(--c,var(--neutral));box-shadow:0 0 12px var(--c,transparent);opacity:.9}
  .tone--red{--c:#ff5d52;border-color:rgba(255,93,82,.24)}
  .tone--green{--c:#1ec27b;border-color:rgba(30,194,123,.22)}
  .tone--amber{--c:#f2b03d;border-color:rgba(242,176,61,.22)}
  .tone--gray{--c:#5d6b7a}

  .c-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;min-height:20px}
  .c-no{font-family:var(--mono);font-size:9.5px;color:var(--tx3);letter-spacing:.08em;padding-top:1px}
  .c-title{margin:0;font-size:12.5px;font-weight:640;letter-spacing:.06em;white-space:nowrap;color:#dbe4ee}
  .c-tag{margin-left:auto;font-size:9.5px;color:var(--tx3);letter-spacing:.05em;white-space:nowrap;
    padding-left:8px;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2.5px 8px;border-radius:999px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:4px}
  .badge:before{content:"";width:4px;height:4px;border-radius:50%;background:currentColor}
  .badge--high{color:#8ce8bb;background:rgba(30,194,123,.13);border:1px solid rgba(30,194,123,.38)}
  .badge--low{color:#f7cd83;background:rgba(242,176,61,.14);border:1px solid rgba(242,176,61,.4)}
  .badge--degraded{color:#c3cedb;background:rgba(111,127,146,.16);border:1px solid rgba(111,127,146,.38)}

  .verdict{margin:0;font-size:14.5px;line-height:1.72;color:#e2e9f2}
  .txt-red{color:#ffb3ad}

  /* 数据行（细线网格，不用盒子） */
  .kv{display:grid;grid-template-columns:1fr 1fr;margin-top:12px;border-top:1px solid var(--line-2)}
  .kv-i{padding:8px 10px 7px 0;border-bottom:1px solid var(--line-2);min-width:0}
  .kv-i:nth-child(odd){border-right:1px solid var(--line-2)}
  .kv-i:nth-child(even){padding-left:11px}
  .kv-i span{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
  .kv-i b{display:block;font-family:var(--mono);font-size:13.5px;font-weight:600;margin-top:2px;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kv-i em{font-style:normal;font-family:var(--sans);font-size:9.5px;color:var(--tx3);font-weight:400;letter-spacing:0}

  /* 标尺 */
  .gauge{width:100%;height:auto;display:block;margin:12px 0 0}
  .gauge text{font-family:var(--mono);font-size:8.5px;fill:#6b7887}

  .strip{margin-top:10px;font-size:11px;line-height:1.6;color:#f7cd83;padding:7px 9px;border-radius:8px;
    background:rgba(242,176,61,.07);border:1px dashed rgba(242,176,61,.3)}

  /* 压测水位 */
  .meter{position:relative;height:26px;margin-top:12px;border-radius:6px;overflow:hidden;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 20px),rgba(255,255,255,.035);
    border:1px solid var(--line-2)}
  .meter .fill{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,93,82,.55),rgba(255,93,82,.10))}
  .meter .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:0 8px;font-family:var(--mono);font-size:10px;color:#e7edf5;letter-spacing:.02em}

  /* 三宫格 */
  .trio{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;border-top:1px solid var(--line-2)}
  .trio-i{padding:8px 0 7px;border-bottom:1px solid var(--line-2)}
  .trio-i + .trio-i{padding-left:11px;border-left:1px solid var(--line-2)}
  .trio-i span{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
  .trio-i b{font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .trio-i em{font-style:normal;font-family:var(--sans);font-size:9px;color:var(--tx3)}

  /* 账户 */
  .accts{margin-top:11px;border-top:1px solid var(--line-2)}
  .row{--c:#5d6b7a;display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:12px}
  .row .nm{color:var(--tx2);min-width:38px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .bar-mini{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.07);position:relative;min-width:20px}
  .row .bar-mini i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--c,var(--neutral))}
  .row .cost{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
  .row .g{font-family:var(--mono);font-size:10.5px;color:var(--tx3);min-width:58px;text-align:right}
  .row.hi{--c:#ff5d52}
  .row.lo{--c:#1ec27b}

  /* 今日操作 */
  .ops{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line-2)}
  .ops li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:12px;color:var(--tx2)}
  .ops .k{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.06em}
  .ops .k.buy{color:#ffb3ad;background:rgba(255,93,82,.14)}
  .ops .k.sell{color:#8ce8bb;background:rgba(30,194,123,.14)}
  .ops .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .ops time{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--tx3)}

  /* 溯源脚注 */
  .src{margin-top:9px;font-size:9.5px;color:#4f5b69;letter-spacing:.04em;display:flex;gap:6px;flex-wrap:wrap}
  .src b{color:#7d8a98;font-weight:500}

  /* 设置 */
  details.set{margin:8px 0 6px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.022)}
  details.set summary{list-style:none;cursor:pointer;padding:12px 13px;font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:7px;letter-spacing:.03em}
  details.set summary::-webkit-details-marker{display:none}
  details.set summary svg{width:13px;height:13px;color:var(--tx3)}
  details.set[open] summary{border-bottom:1px solid var(--line-2)}
  .set-body{padding:12px 13px 14px}
  .fld{display:flex;gap:8px;flex-wrap:wrap}
  .fld input{flex:1 1 170px;min-width:0;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:9px;
    color:var(--tx);padding:11px 11px;font-size:16px;font-family:var(--mono)}
  .fld input::placeholder{color:#4a5663;font-family:var(--sans);font-size:13px}
  .btn{min-height:44px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);
    font-size:12.5px;color:var(--tx);display:inline-flex;align-items:center;gap:6px}
  .btn:active{transform:scale(.98)}
  .btn.gold{border-color:rgba(217,168,78,.4);color:#f0cd93;background:rgba(217,168,78,.1)}
  .note{font-size:10.5px;line-height:1.65;color:var(--tx3);margin:10px 0 12px}
  .row2{display:flex;gap:8px;flex-wrap:wrap}

  footer{margin-top:16px;font-size:9.5px;line-height:1.8;color:#45505d;text-align:center;letter-spacing:.03em}
  footer a{color:#6d7a88;text-decoration:none;border-bottom:1px dotted #37414d}

  /* 骨架 */
  #skeleton{display:flex;flex-direction:column;gap:10px}
  .sk{border:1px solid var(--line-2);border-radius:14px;background:rgba(255,255,255,.025);overflow:hidden;position:relative}
  .sk:after{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.055),transparent);animation:sh 1.5s infinite}
  @keyframes sh{100%{transform:translateX(100%)}}
  .sk.a{height:118px}.sk.b{height:96px}.sk.c{height:72px}
  body.ready #skeleton{display:none}

  /* 入场 */
  .rise{animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* toast */
  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
    background:#151d27;border:1px solid var(--line);color:var(--tx);font-size:12.5px;padding:9px 15px;border-radius:999px;
    opacity:0;pointer-events:none;transition:.24s;z-index:99;box-shadow:0 12px 30px rgba(0,0,0,.6);white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:359px){
    body{padding-left:12px;padding-right:12px;font-size:14px}
    .b-text{font-size:15px}
    .q-price{font-size:28px}
    .spark{width:96px}
    .kv{grid-template-columns:1fr}
    .kv-i:nth-child(odd){border-right:0;padding-right:0}
    .kv-i:nth-child(even){padding-left:0}
  }
  @media (min-width:640px){
    .kv{grid-template-columns:repeat(4,1fr)}
    .kv-i:nth-child(3n){border-right:1px solid var(--line-2)}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#d9a84e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.8l7.2 4.1v6.2c0 4.3-3 7.9-7.2 9.1-4.2-1.2-7.2-4.8-7.2-9.1V6.9z"/><path d="M8.8 12.2l2.2 2.2 4.2-4.4"/>
      </svg>
    </div>
    <div class="brand">
      <h1>XAU Copilot</h1>
      <p>Multi-Source · No K-Line</p>
    </div>
    <div class="top-right">
      <span class="live" id="live"><i></i><span id="live-txt">连接中</span></span>
      <button class="icon-btn" id="btn-refresh" aria-label="刷新数据">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4.5V9h-4.5"/></svg>
      </button>
    </div>
  </header>

  <div id="quote"></div>
  <div class="status" id="status">正在读取云端快照与 XAUUSD 行情…</div>

  <div id="skeleton"><div class="sk a"></div><div class="sk b"></div><div class="sk c"></div></div>

  <div id="briefing"></div>
  <div id="decision"></div>
  <div id="trade-plan"></div>
  <div id="stress"></div>
  <div id="grid"></div>
  <div id="rebalance"></div>
  <div id="discipline"></div>

  <details class="set">
    <summary>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M4 12h2M18 12h2M12 4v2M12 18v2"/></svg>
      推送与数据
    </summary>
    <div class="set-body">
      <div class="fld">
        <input id="hook-url" type="url" inputmode="url" placeholder="Webhook URL（飞书/钉钉/Slack，可留空）" autocomplete="off" />
        <button class="btn gold" id="btn-hook">保存</button>
      </div>
      <p class="note">仅「强共振」或「网格熔断」时静默推送一次，同事件同日去重。URL 只存本机浏览器。<br />
        持仓、计划、操作全部来自 GitHub 快照，换设备打开同一地址即一致；行情由 XAUUSD 独立源实时校验。</p>
      <div class="row2">
        <button class="btn" id="btn-export">导出快照</button>
        <button class="btn" id="btn-reload">强制重取</button>
      </div>
    </div>
  </details>

  <footer>
    内部源 <span id="src-note">xau-desk-data</span> · 外部源 XAUUSD（新浪伦敦金日线 + gold-api 现价）<br />
    仅做多源印证与纪律复核，不含 K 线主图，不构成投资建议。
  </footer>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
