<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#121212" />
<meta name="color-scheme" content="dark" />
<!-- 内联 SVG favicon：避免浏览器自动请求 /favicon.ico 触发 404 console error，零外链 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121212'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' font-family='sans-serif' text-anchor='middle' fill='%23D4A24C'%3EX%3C/text%3E%3C/svg%3E" />
<title>XAU Copilot · 决策指挥中心</title>
<!-- 本工作台通过「GitHub Pages 静态托管 + Actions 数据落盘」搭建，零外部依赖 -->
<style>
:root{
  --bg:#121212; --card:#1E1E1E; --card-2:#242424;
  --line:rgba(255,255,255,.065); --line-2:rgba(255,255,255,.04);
  --tx:#E9ECEF; --tx-2:#9AA3AD; --tx-3:#6B7480;
  /* 红绿仅表数值涨跌（红涨绿跌）；方向判断/状态类一律用红绿以外的中性色 */
  --red:#FF5D52; --green:#3FD68C; --amber:#F5A623; --gray:#6B7280;
  --gold:#D4A24C; --violet:#A78BFA; --indigo:#8B93F8;
  --r:14px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx); font-family:var(--sans);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100vh; padding-bottom:calc(28px + env(safe-area-inset-bottom));
}
.shell{max-width:640px;margin:0 auto;padding:0 12px}

/* ── 顶栏 ── */
.topbar{
  display:flex;align-items:center;gap:10px;padding:14px 4px 10px;
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,#121212 72%,rgba(18,18,18,0));
}
.brand{display:flex;align-items:baseline;gap:7px;min-width:0}
.brand b{font-size:15px;letter-spacing:.4px;font-weight:650}
.brand span{font-size:10px;color:var(--tx-3);letter-spacing:1.2px;text-transform:uppercase}
.brand .ver{
  font-size:9px;color:var(--gold);border:1px solid rgba(212,162,76,.32);border-radius:4px;
  padding:0 4px;font-family:var(--mono);letter-spacing:0;text-transform:none;line-height:1.6;
}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--indigo);box-shadow:0 0 8px rgba(139,147,248,.75)}
.dot.warn{background:var(--amber);box-shadow:0 0 8px rgba(245,166,35,.7)}
.dot.bad{background:var(--violet);box-shadow:0 0 8px rgba(167,139,250,.7)}
.iconbtn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--tx-2);display:grid;place-items:center;cursor:pointer;
  transition:background .16s,color .16s;
}
.iconbtn:active{background:var(--card-2);color:var(--tx)}
.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ── 晨报气泡 ── */
.bubble{
  position:relative;border-radius:16px;padding:15px 16px 13px;margin-bottom:12px;
  background:linear-gradient(150deg,#232323 0%,#1A1A1A 58%,#191919 100%);
  border:1px solid rgba(212,162,76,.16);
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 26px rgba(0,0,0,.34);
  overflow:hidden;
}
.bubble::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,var(--gold),rgba(212,162,76,.06));
}
.bubble::after{
  content:"";position:absolute;right:-40px;top:-58px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,162,76,.13),transparent 68%);pointer-events:none;
}
.b-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;row-gap:4px}
/* 320px 下「AI 研判 / 时间 / 置信」会互相挤成竖排，逐个禁折行 + 允许整行换行 */
.b-head .tag,.b-head time{white-space:nowrap}
.tag{
  font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--gold);
  border:1px solid rgba(212,162,76,.34);border-radius:5px;padding:1.5px 6px;font-weight:600;
}
.b-head time{font-size:10.5px;color:var(--tx-3);font-family:var(--mono)}
.b-text{margin:0;font-size:15px;line-height:1.62;font-weight:450;letter-spacing:.15px}
.b-text em{font-style:normal;color:var(--amber);font-weight:600}
.b-text u{text-decoration:none;color:var(--amber);font-weight:600}
.b-text i{font-style:normal;color:var(--indigo);font-weight:600}
.b-foot{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{
  font-size:10px;padding:2.5px 7px;border-radius:5px;background:rgba(255,255,255,.045);
  color:var(--tx-2);border:1px solid var(--line-2);font-family:var(--mono);
}
.chip.warn{color:var(--amber);border-color:rgba(245,166,35,.28);background:rgba(245,166,35,.08)}
.chip.bad{color:var(--amber);border-color:rgba(245,166,35,.28);background:rgba(245,166,35,.08)}
.chip.ok{color:var(--indigo);border-color:rgba(139,147,248,.26);background:rgba(139,147,248,.08)}

/* ── v2.9.0 首页分层结论：定调 / 趋势 / 四层 / 区间 / 情景 / 失效 ── */
.bl-badge{margin-left:auto;white-space:nowrap;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.5px;font-family:var(--mono)}
.bl-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 0 8px}
.bl-stance{font-size:19px;font-weight:750;letter-spacing:-.3px;line-height:1.16}
.bl-stance.amber{color:var(--amber)}
.bl-stance.indigo{color:var(--indigo)}
.bl-stance.gray{color:var(--tx-2)}
.bl-stance.violet{color:var(--violet)}
.bl-meta{font-size:10px;color:var(--tx-3);font-family:var(--mono);letter-spacing:.2px}
.bubble .b-text{font-size:14px;line-height:1.66;margin-bottom:2px}

.sec-h{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  font-size:9.5px;color:var(--tx-3);letter-spacing:.9px;font-family:var(--mono);
  margin:12px 0 6px;
}
.sec-n{margin-left:auto;font-size:9.5px;letter-spacing:0;color:var(--tx-3);opacity:.85;font-family:var(--sans)}

/* 多周期趋势 */
.trend-row{display:grid;gap:1px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:10px}
.tr{background:rgba(255,255,255,.022);padding:7px 9px;display:grid;grid-template-columns:46px 1fr;gap:2px 8px}
.tr-h{font-family:var(--mono);font-size:9.5px;color:var(--tx-3);grid-row:span 2;align-self:center;letter-spacing:.2px}
.tr-d{font-size:12px;font-weight:650}
.tr-d.amber{color:var(--amber)} .tr-d.indigo{color:var(--indigo)} .tr-d.gray{color:var(--tx-2)}
.tr-b{font-size:10px;color:var(--tx-3);font-family:var(--mono);letter-spacing:.1px}

/* 四层依据：中轴对称的双向条 */
.ly-wrap{margin-top:2px}
.ly{display:grid;grid-template-columns:30px 1fr 40px 34px;align-items:center;gap:8px;padding:4px 0}
.ly-k{font-size:10.5px;color:var(--tx-2)}
.ly-b{position:relative;height:5px;background:rgba(255,255,255,.055);border-radius:3px;overflow:hidden}
.ly-b::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(255,255,255,.14)}
.ly-b i{position:absolute;top:0;bottom:0;border-radius:2px}
.ly-b i.pos{background:var(--amber)} .ly-b i.neg{background:var(--indigo)} .ly-b i.flat{background:var(--gray)}
.ly-v{font-family:var(--mono);font-size:11px;font-weight:600;text-align:right}
.ly-v.pos{color:var(--amber)} .ly-v.neg{color:var(--indigo)} .ly-v.flat{color:var(--tx-3)}
.ly-s{font-size:9.5px;text-align:right;color:var(--tx-3)}
.ly-s.pos{color:#FFC862} .ly-s.neg{color:#B9BEFF}

/* 5 日波动区间 */
.cone-svg{display:block;width:100%;height:40px;margin:2px 0 2px}
.cn-2{fill:rgba(139,147,248,.10)}
.cn-1{fill:rgba(139,147,248,.26)}
.cn-mid{stroke:rgba(255,255,255,.28);stroke-width:1;stroke-dasharray:2 2}
.cn-px{fill:var(--gold)}
.cone-f{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--tx-3)}
.cone-f .mid{color:var(--gold);font-weight:700}
.cone-f em{font-style:normal;font-size:8.5px;color:var(--tx-3);margin-left:3px;font-weight:400}
.cone-n{font-size:9px;color:var(--tx-3);margin-top:3px;letter-spacing:.1px}

/* 三情景 */
.scen{display:grid;gap:7px}
.sc{background:rgba(255,255,255,.025);border:1px solid var(--line-2);border-radius:9px;padding:7px 9px}
.sc-top{display:flex;align-items:baseline;gap:7px}
.sc-top b{font-size:11.5px;font-weight:650;letter-spacing:.3px}
.sc-top b.dn{color:var(--indigo)} .sc-top b.up{color:var(--amber)} .sc-top b.mid{color:var(--tx-2)}
.sc-p{font-family:var(--mono);font-size:11px;color:var(--tx-2)}
.sc-t{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:650;color:var(--tx)}
.sc-t em{font-style:normal;font-size:8.5px;color:var(--tx-3);margin-left:2px;font-weight:400}
.sc-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden;margin:4px 0 4px}
.sc-bar i{display:block;height:100%;border-radius:2px}
.sc-bar i.dn{background:var(--indigo)} .sc-bar i.up{background:var(--amber)} .sc-bar i.mid{background:var(--gray)}
.sc-c{font-size:9.5px;color:var(--tx-3);line-height:1.45}

/* 失效条件 */
.inv{display:grid;gap:5px}
.inv-i{display:flex;gap:7px;align-items:flex-start;font-size:11px;line-height:1.5}
.inv-m{
  flex:0 0 auto;font-size:9px;padding:1px 5px;border-radius:4px;margin-top:1px;
  color:var(--tx-3);border:1px solid var(--line);font-family:var(--mono);
}
.inv-m.on{color:#FFC862;border-color:rgba(245,166,35,.4);background:rgba(245,166,35,.1)}
.inv-t{color:var(--tx-2)}

/* ── M2 价格位置尺（纵列，避免横向标签打架） ── */
.ma-ruler{position:relative;padding-left:13px;margin:2px 0 4px}
.ma-ruler::before{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:1px;background:var(--line)}
.mr-row{
  position:relative;display:grid;grid-template-columns:64px 1fr auto;align-items:baseline;
  gap:8px;padding:4.5px 0;font-size:11.5px;
}
.mr-row::before{
  content:"";position:absolute;left:-13px;top:50%;width:7px;height:7px;margin-top:-3.5px;
  border-radius:50%;background:var(--card);border:1px solid var(--tx-3);
}
.mr-px{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:-.2px}
.mr-k{font-size:10.5px;color:var(--tx-3)}
.mr-d{font-family:var(--mono);font-size:10.5px;color:var(--tx-3)}
.mr-row.res .mr-px{color:#B9BEFF}
.mr-row.sup .mr-px{color:#FFC862}
.mr-row.now{background:rgba(212,162,76,.09);border-radius:6px;padding-left:7px;margin-left:-7px}
.mr-row.now::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 6px rgba(212,162,76,.55)}
.mr-row.now .mr-px{color:var(--gold);font-weight:750}
.mr-row.now .mr-k{color:var(--tx-2)}

/* ── M2 因子贡献（右多左空） ── */
.factors{display:grid;gap:1px}
.fx{display:grid;grid-template-columns:74px 1fr 40px;align-items:center;gap:9px;padding:4px 0}
.fx-k{font-size:10.5px;color:var(--tx-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-bar{position:relative;height:5px;background:rgba(255,255,255,.055);border-radius:3px;overflow:hidden}
.fx-bar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(255,255,255,.14)}
.fx-bar i{position:absolute;top:0;bottom:0;border-radius:2px}
.fx-bar i.pos{background:var(--amber)} .fx-bar i.neg{background:var(--indigo)}
.fx-v{font-family:var(--mono);font-size:10.5px;font-weight:600;text-align:right}
.fx-v.pos{color:#FFC862} .fx-v.neg{color:#B9BEFF}

/* ── M2 RSI 刻度 ── */
.rsi-gauge{margin-top:10px}
.rg-top{display:flex;align-items:baseline;gap:7px;margin-bottom:4px}
.rg-k{font-family:var(--mono);font-size:9.5px;color:var(--tx-3);letter-spacing:.6px}
.rg-top b{font-family:var(--mono);font-size:13px;font-weight:700}
.rg-top b.hot{color:var(--amber)} .rg-top b.cold{color:var(--indigo)} .rg-top b.mid{color:var(--tx-2)}
.rg-n{margin-left:auto;font-size:10px;color:var(--tx-3)}
.rg-svg{display:block;width:100%;height:14px}
.rg-bg{fill:rgba(255,255,255,.07)}
.rg-cold{fill:rgba(139,147,248,.38)}
.rg-hot{fill:rgba(245,166,35,.34)}
.rg-mark{stroke:#EDEFF2;stroke-width:2;stroke-linecap:round}
/* 标签必须落在刻度真位置上：用 flex 均分会把 30 放到 25%、70 放到 75%，与刻度错位 */
.rg-l{position:relative;height:11px;font-family:var(--mono);font-size:8.5px;color:var(--tx-3);margin-top:2px}
.rg-l span{position:absolute;top:0;transform:translateX(-50%)}

/* ── 卡片 ── */
.card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 15px 13px 17px;margin-bottom:10px;
  overflow:hidden;transition:border-color .2s;
}
.card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bar,var(--gray));
  opacity:.92;
}
.card[data-tone="amber"]{--bar:var(--amber)}
.card[data-tone="gray"]{--bar:var(--gray)}
.card[data-tone="violet"]{--bar:var(--violet)}
.card[data-tone="indigo"]{--bar:var(--indigo)}
.card.fuse{border-color:rgba(245,166,35,.24);background:linear-gradient(180deg,rgba(245,166,35,.07),var(--card) 62%)}

.c-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.c-no{font-family:var(--mono);font-size:10px;color:var(--tx-3);letter-spacing:.6px}
.c-title{font-size:12px;font-weight:600;color:var(--tx-2);letter-spacing:.3px}
.c-head .badge{margin-left:auto}

/* 徽章 */
.badge{
  font-size:10.5px;font-weight:700;padding:2.5px 9px;border-radius:6px;letter-spacing:.6px;
  font-family:var(--mono);
}
.b-high{background:rgba(245,166,35,.16);color:#FFC862;border:1px solid rgba(245,166,35,.34)}
.b-mid{background:rgba(139,147,248,.14);color:#B9BEFF;border:1px solid rgba(139,147,248,.32)}
.b-low{background:rgba(245,166,35,.15);color:#FFC05C;border:1px solid rgba(245,166,35,.34)}
.b-deg{background:rgba(255,255,255,.06);color:var(--tx-3);border:1px solid var(--line)}

/* ── M1 宏观雷达 ── */
.pills{display:flex;gap:6px;margin-bottom:12px}
.pill{
  flex:1;min-width:0;background:var(--card-2);border:1px solid var(--line-2);border-radius:9px;
  padding:7px 8px;text-align:center;
}
.pill .k{font-size:9px;color:var(--tx-3);letter-spacing:.8px;font-family:var(--mono);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .k em{font-style:normal;opacity:.62;margin-left:3px;font-size:8px;letter-spacing:0}
.pill .v{font-size:13.5px;font-weight:650;font-family:var(--mono);margin-top:1px;display:block;letter-spacing:-.2px}
.pill .v.up{color:var(--amber)}   /* 宏观方向判断：红绿以外的中性色 */
.pill .v.dn{color:var(--indigo)}
.pill .v.flat{color:var(--tx-2)}
.pills+.macro-at{margin-top:-6px}
.macro-at{font-size:9.5px;color:var(--tx-3);font-family:var(--mono);letter-spacing:.2px;margin-bottom:12px}
.macro-at.late{color:var(--amber)}

.dual{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden}
.dual>div{background:var(--card);padding:10px 11px}
.dual .lbl{font-size:9.5px;color:var(--tx-3);letter-spacing:.9px;margin-bottom:3px;font-family:var(--mono);display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.dual .big{font-size:19px;font-weight:650;font-family:var(--mono);letter-spacing:-.6px;line-height:1.2}
.dual .unit{font-size:10px;color:var(--tx-3);font-weight:400;margin-left:2px;letter-spacing:0}
.dual .sub{font-size:10.5px;color:var(--tx-2);margin-top:3px;display:flex;align-items:center;gap:4px}
/* v2.6.0 15 秒实时价：涨红跌绿，时效行独立成行，避免挤在副标题里被截断 */
.spot-chg{font-family:var(--mono);font-size:10px;font-weight:650;letter-spacing:0;white-space:nowrap}
.spot-chg.up{color:var(--red)}
.spot-chg.dn{color:var(--green)}
.spot-chg.flat{color:var(--tx-3)}
.spot-at{font-size:9.5px;color:var(--tx-3);font-family:var(--mono);letter-spacing:.2px;margin-top:6px}
.spot-at.live{color:var(--green)}
.sig{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;letter-spacing:.3px}
.sig.buy{color:#FFC862;background:rgba(245,166,35,.13)}
.sig.sell{color:#B9BEFF;background:rgba(139,147,248,.13)}
.sig.mid{color:var(--tx-2);background:rgba(255,255,255,.06)}

.prem{
  margin-top:10px;padding-top:9px;border-top:1px solid var(--line-2);
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--tx-2);
}
.prem b{font-family:var(--mono);font-size:13px;font-weight:650}
.prem.frozen{color:var(--tx-3)}
.prem .lock{font-size:9.5px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--tx-3)}

/* ── M2 决策 ── */
.verdict{text-align:center;padding:6px 0 12px}
.verdict .hl{font-size:25px;font-weight:750;letter-spacing:-.5px;line-height:1.2}
.verdict .hl.amber{color:var(--amber)}
.verdict .hl.gray{color:var(--tx-2)}
.verdict .hl.violet{color:var(--violet)}
.verdict .hl.indigo{color:var(--indigo)}
.vs{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--card-2);border-radius:10px;padding:10px 8px;margin-bottom:10px;
}
.vs .side{flex:1;text-align:center;min-width:0}
.vs .side .k{font-size:9px;color:var(--tx-3);letter-spacing:.8px;margin-bottom:2px}
.vs .side .v{font-size:13px;font-weight:650;font-family:var(--mono)}
.vs .side .v.dn{color:var(--indigo)}
.vs .side .v.up{color:var(--amber)}
.vs .mid{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap}
.vs .mid.bad{color:var(--amber);background:rgba(245,166,35,.14);border:1px solid rgba(245,166,35,.3)}
.vs .mid.ok{color:var(--indigo);background:rgba(139,147,248,.12);border:1px solid rgba(139,147,248,.28)}
.note{font-size:12px;line-height:1.6;color:var(--tx-2);margin:0}

/* ── M2 外部技术指标网格 ── */
.tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.tech-grid .tc{background:var(--card-2);padding:7px 10px;min-width:0}
.tech-grid .tc .k{font-size:9px;color:var(--tx-3);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tech-grid .tc .v{font-size:12.5px;font-weight:700;font-family:var(--mono);letter-spacing:-.2px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tech-grid .tc .v.chg-up{color:var(--red)}    /* 数值涨跌：涨红 */
.tech-grid .tc .v.chg-dn{color:var(--green)}  /* 数值涨跌：跌绿 */
.tech-grid .tc .v.bull{color:var(--amber)}    /* 方向判断：偏多琥珀（红绿以外） */
.tech-grid .tc .v.bear{color:var(--indigo)}   /* 方向判断：偏空靛蓝（红绿以外） */
.tech-grid .tc .v.flat{color:var(--tx-2)}
.tech-grid .tc .n{font-size:9px;color:var(--tx-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:640px){.tech-grid{grid-template-columns:repeat(3,1fr)}}

/* ── M3 体检 ── */
.pnl-wrap{text-align:center;padding:4px 0 10px}
.pnl-cap{font-size:10.5px;color:var(--tx-3);letter-spacing:1px;margin-bottom:3px}
.pnl{font-size:32px;font-weight:750;font-family:var(--mono);letter-spacing:-1.4px;line-height:1.1}
.pnl.red{color:var(--red)}
.pnl.green{color:var(--green)}
.pnl.gray{color:var(--tx-2);font-size:22px;letter-spacing:-.5px}
.pnl-sub{font-size:11px;color:var(--tx-2);margin-top:5px;font-family:var(--mono)}
.pnl-sub b{color:var(--tx);font-weight:600}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:2px}
.grid2>div{background:var(--card-2);padding:10px 11px}
.grid2 .k{font-size:9.5px;color:var(--tx-3);letter-spacing:.7px;margin-bottom:2px}
.grid2 .v{font-size:16px;font-weight:700;font-family:var(--mono);letter-spacing:-.4px}
.src-note{font-size:9.5px;color:var(--tx-3);line-height:1.5;margin-top:7px;letter-spacing:.2px}

.alert-strip{
  margin-top:10px;display:flex;align-items:center;gap:7px;
  border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.45;
}
/* 告警/状态条：判断类统一用红绿以外的中性色 */
.alert-strip.warn{background:rgba(245,166,35,.10);border:1px solid rgba(245,166,35,.30);color:#FFC862}
.alert-strip.calm{background:rgba(139,147,248,.08);border:1px solid rgba(139,147,248,.24);color:#B9BEFF}
.alert-strip.gray{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--tx-3)}
.alert-strip.violet{background:rgba(167,139,250,.10);border:1px solid rgba(167,139,250,.28);color:#C4B5FD}
.alert-strip svg{width:13px;height:13px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ── 技术面三档成立条件（v2.8.0，挂在熔断条下方）── */
.tech-ladder{margin-top:11px;border-top:1px solid var(--line-2);padding-top:10px}
.tl-head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.tl-title{font-size:10px;color:var(--tx-3);letter-spacing:.9px;font-family:var(--mono)}
.tl-sum{margin-left:auto;font-size:10.5px;color:var(--tx-2)}
.tl-tier{
  padding:8px 9px 7px;border-radius:9px;margin-bottom:6px;
  background:rgba(255,255,255,.028);border:1px solid transparent;
}
.tl-tier.on{background:rgba(245,166,35,.09);border-color:rgba(245,166,35,.30)}
.tl-trow{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.tl-name{font-size:11.5px;font-weight:650;color:var(--tx);letter-spacing:.3px}
.tl-flag{margin-left:auto;font-size:9.5px;font-family:var(--mono);color:var(--tx-3);letter-spacing:.4px}
.tl-tier.on .tl-flag{color:#FFC862}
.cond{display:flex;align-items:flex-start;flex-wrap:wrap;gap:5px;padding:1.5px 0;font-size:10.5px;line-height:1.5}
/* 满足=亮、不满足=暗；不用红绿，避免把「条件成立」读成涨跌信号 */
.cond-ico{width:11px;height:11px;flex:0 0 auto;margin-top:2.5px;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke:#828C99}
.cond.ok .cond-ico{stroke:#FFC862}
/* active 档背景是琥珀底，勾必须再亮一档才不糊在一起 */
.tl-tier.on .cond.ok .cond-ico{stroke:#FFE7B8}
.cond-t{flex:1 1 140px;min-width:0;color:var(--tx-3)}
.cond.ok .cond-t{color:var(--tx-2)}
.cond-n{flex:0 0 auto;margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--tx-3);white-space:nowrap}
.cond.ok .cond-n{color:var(--tx-2)}
/* 前置两条每档都重复，压低视觉重量；把焦点留给门槛那条 */
.cond[data-k="pre"]{font-size:9.5px;opacity:.72}
.cond[data-k="gate"] .cond-t{color:var(--tx-2);font-weight:600}
.cond[data-k="gate"].no .cond-t{color:var(--tx-3);font-weight:400}
.tl-hint{margin-top:5px;font-size:10.5px;line-height:1.5;color:#FFC862}

/* ── 行数据 ── */
.rows{margin-top:2px}
.row{
  display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-2);
  font-size:12px;
}
.row:last-child{border-bottom:0}
.row .k{color:var(--tx-2);flex:0 0 auto}
.row .v{margin-left:auto;font-family:var(--mono);font-weight:600;text-align:right}
.row .v.red{color:var(--red)} .row .v.green{color:var(--green)} .row .v.amber{color:var(--amber)}
.mini{font-size:9.5px;color:var(--tx-3);margin-left:5px;font-weight:400}

/* 档位表（v2.7.0：每档可点，点开看该档分配了多少克） */
.lv-mode{margin-top:8px;font-size:10px;line-height:1.55;color:var(--tx-3);letter-spacing:.2px}
.lv-list{margin-top:8px;border-top:1px solid var(--line-2)}
.lv-row{
  display:grid;grid-template-columns:26px 1fr auto 48px 14px;align-items:center;gap:10px;
  width:100%;min-height:44px;padding:8px 2px;margin:0;border:0;border-bottom:1px solid var(--line-2);
  background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.lv-row:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;border-radius:6px}
.lv-row .lv-no{
  font-family:var(--mono);font-size:10px;color:var(--tx-3);text-align:center;
  border:1px solid var(--line);border-radius:5px;padding:2px 0;
}
.lv-row .lv-px{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:-.2px}
.lv-row .lv-g{font-family:var(--mono);font-size:11px;color:var(--tx-2);white-space:nowrap}
.lv-row .lv-dp{font-family:var(--mono);font-size:10.5px;color:var(--tx-3);white-space:nowrap;text-align:right}
.lv-row .lv-caret{width:14px;height:14px;stroke:var(--tx-3);stroke-width:2;fill:none;transition:transform .18s}
.lv-row.open .lv-caret{transform:rotate(90deg)}
.lv-row.next .lv-no{border-color:rgba(245,166,35,.55);color:var(--gold)}
.lv-row.next .lv-px{color:var(--gold)}
.lv-row.on .lv-no{background:rgba(245,166,35,.14)}
.lv-row.open{background:rgba(255,255,255,.025)}
.lv-detail{
  padding:9px 10px 10px;margin:2px 0 8px;border-radius:8px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);
  font-size:11.5px;display:grid;gap:6px;
}
.lv-detail .kv{display:flex;align-items:baseline;gap:10px;color:var(--tx-2)}
.lv-detail .kv span{flex:0 0 auto;font-size:10.5px;color:var(--tx-3)}
.lv-detail .kv b{margin-left:auto;font-family:var(--mono);font-weight:600;color:var(--tx);text-align:right}
.lv-next{margin-top:6px;font-size:10.5px;color:var(--tx-2);font-family:var(--mono);letter-spacing:.2px}

/* 账户条 */
.acct{padding:9px 0;border-bottom:1px solid var(--line-2)}
.acct:last-child{border-bottom:0}
.acct .top{display:flex;align-items:center;gap:7px;font-size:12px;margin-bottom:5px}
.acct .nm{font-weight:600}
.acct .tag2{font-size:9px;padding:1px 5px;border-radius:4px;letter-spacing:.4px}
.tag2.cut{color:#B9BEFF;background:rgba(139,147,248,.13)}
.tag2.add{color:#FFC862;background:rgba(245,166,35,.12)}
.acct .cost{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--tx-2)}
.acct .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.acct .bar i{display:block;height:100%;border-radius:2px;background:var(--gold);opacity:.72}

/* 纪律条目 */
.disc{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:11.5px;line-height:1.5;color:var(--tx-2)}
.disc:not(:last-child){border-bottom:1px solid var(--line-2)}
.disc .b{width:5px;height:5px;border-radius:50%;margin-top:6px;flex:0 0 auto;background:var(--gray)}
.disc.bad .b{background:var(--amber)}
.disc.ok .b{background:var(--indigo)}

/* 降级条 */
.deg{
  display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--tx-3);
  background:rgba(255,255,255,.03);border:1px dashed var(--line);border-radius:8px;padding:9px 10px;margin-top:8px;
}
/* 降级条里的 info 图标：不限尺寸会被 SVG 默认 300×150 撑成大黑块 */
.deg svg{width:15px;height:15px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ── 弹窗 ── */
.modal{
  position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
}
.modal[hidden]{display:none}
.modal .box{
  width:100%;max-width:340px;background:#1F1F1F;border:1px solid rgba(245,166,35,.34);
  border-radius:16px;padding:20px 18px;text-align:center;
  box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.modal .warn-ico{width:40px;height:40px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:rgba(245,166,35,.12)}
.modal .warn-ico svg{width:20px;height:20px;fill:none;stroke:var(--amber);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modal h3{margin:0 0 8px;font-size:16px;color:#FFC862}
.modal p{margin:0 0 14px;font-size:12.5px;color:var(--tx-2);line-height:1.6}
.modal .cd{font-family:var(--mono);font-size:26px;font-weight:750;color:var(--amber);margin-bottom:4px}
.modal .cd small{font-size:10px;color:var(--tx-3);font-weight:400;display:block;letter-spacing:1px}
.modal .btns{display:flex;gap:8px}
.modal button{
  flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card-2);
  color:var(--tx);font-size:13px;font-weight:600;font-family:var(--sans);cursor:pointer;
}
.modal button.danger{background:rgba(245,166,35,.14);border-color:rgba(245,166,35,.36);color:#FFC862}

/* ── 设置抽屉 ── */
.drawer{
  position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
}
.drawer[hidden]{display:none}
.drawer .panel{
  position:absolute;right:0;bottom:0;left:0;max-width:640px;margin:0 auto;
  background:#191919;border-top-left-radius:18px;border-top-right-radius:18px;
  border-top:1px solid var(--line);padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:82vh;overflow:auto;
}
.drawer h3{margin:0 0 12px;font-size:14px;display:flex;align-items:center}
.drawer h3 button{margin-left:auto;background:none;border:0;color:var(--tx-3);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;color:var(--tx-3);margin-bottom:5px;letter-spacing:.5px}
.fld input{
  width:100%;height:42px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--tx);padding:0 11px;font-size:16px;font-family:var(--mono);
}
.fld .hint{font-size:10.5px;color:var(--tx-3);margin-top:4px;line-height:1.5}
.btn-row{display:flex;gap:8px;margin-top:4px}
.btn-row button{
  flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  color:var(--tx);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans);
}
.btn-row button.primary{background:rgba(212,162,76,.16);border-color:rgba(212,162,76,.4);color:#E8C98A}

/* ── 页脚 ── */
.foot{
  margin-top:14px;padding:12px 4px 0;border-top:1px solid var(--line-2);
  font-size:10px;color:var(--tx-3);line-height:1.7;
}
.foot b{color:var(--tx-2);font-weight:600}
.foot .src{font-family:var(--mono);font-size:9.5px}

/* 骨架屏 */
.skel{background:linear-gradient(90deg,#1E1E1E 25%,#262626 50%,#1E1E1E 75%);background-size:200% 100%;
  animation:sk 1.3s ease-in-out infinite;border-radius:6px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.rise{animation:rise .42s cubic-bezier(.22,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .rise,.skel{animation:none}
}
/* 桌面 */
@media (min-width:640px){
  .shell{padding:0 18px}
  .dual .big{font-size:21px}
  .pnl{font-size:36px}
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><b>XAU Copilot</b><span>Decision Deck</span><span class="ver" id="app-ver">v2.9.0</span></div>
    <div class="tb-right">
      <span class="dot" id="live-dot" title="数据源状态"></span>
      <button class="iconbtn" id="btn-refresh" title="刷新" aria-label="刷新">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="iconbtn" id="btn-settings" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main id="app">
    <section id="m0" aria-label="AI 晨报"></section>
    <section id="m1" aria-label="宏观与双轨雷达"></section>
    <section id="m2" aria-label="外部技术面决策"></section>
    <section id="m3" aria-label="账户体检"></section>
    <section id="m4" aria-label="网格效率"></section>
    <section id="m5" aria-label="多账户再平衡"></section>
    <section id="m6" aria-label="纪律复盘"></section>
  </main>

  <footer class="foot">
    <div><b>XAU Copilot</b> · 外部行情指标决策辅助，不构成投资建议。</div>
    <div class="src" id="foot-src">数据源：XAUUSD 外部实时行情 · 服务端预算指标 · 宏观</div>
  </footer>
</div>

<div class="modal" id="fomo" hidden>
  <div class="box">
    <div class="warn-ico">
      <svg viewBox="0 0 24 24"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
    </div>
    <h3>纪律扣分 · 逆势接飞刀</h3>
    <p id="fomo-text">外部技术面偏空，今日仍有买入操作。是否确认强行买入？</p>
    <div class="cd" id="fomo-cd">10<small>秒后可确认</small></div>
    <div class="btns">
      <button id="fomo-cancel">取消（推荐）</button>
      <button id="fomo-ok" class="danger" disabled>强行买入</button>
    </div>
  </div>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="panel">
    <h3>设置<button id="drawer-close" aria-label="关闭">×</button></h3>
    <div class="fld">
      <label>Webhook 推送地址（可选）</label>
      <input id="set-hook" type="url" inputmode="url" placeholder="https://..." />
      <div class="hint">外部技术面转空/转多或熔断时静默 POST 一次，同日去重。留空则关闭推送。</div>
    </div>
    <div class="fld">
      <label>强制刷新间隔</label>
      <div class="hint">现价 60 秒、宏观与评级 15 分钟自动刷新；点右上角可立即重取。</div>
    </div>
    <div class="btn-row">
      <button id="btn-export">导出 JSON</button>
      <button id="btn-clear" class="primary">清除本地缓存</button>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
