name: sync-data

on:
  schedule:
    - cron: "*/15 * * * *"   # 每 15 分钟拉一次老应用私有库快照
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync-data.mjs"

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync data.json → data/live.json
        env:
          XAU_DATA_TOKEN: ${{ secrets.XAU_DATA_TOKEN }}
        run: node scripts/sync-data.mjs
      - name: Commit snapshot
        run: |
          git config user.name "xau-copilot-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "no changes"
            exit 0
          fi
          git add data/live.json data/meta.json
          git commit -m "chore(data): sync snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
